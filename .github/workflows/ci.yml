name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  testes:
    name: Testes e lançador (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilação de todos os módulos
        run: python -m compileall -q scriptLattes scriptLattes.py tests

      - name: Testes automatizados
        run: python -m unittest discover -s tests -v

      # A janela gráfica só é exercitada de verdade onde há servidor gráfico: no
      # Linux instalamos um servidor virtual (Xvfb), que roda os testes da janela em
      # vez de pulá-los.
      - name: Servidor gráfico virtual (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Testes com janela gráfica (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v

      # O assistente precisa funcionar com entrada vinda de um script (é assim que ele
      # será usado por quem cola uma lista de currículos e aperta Enter).
      #
      # Este passo é todo em Python de propósito: o `mktemp -d` do Git Bash devolve um
      # caminho do MSYS (/tmp/...) que o Python do Windows resolve para outra pasta
      # (<unidade>:\tmp\...), então verificar com `test -f` no bash falhava no Windows.
      # Aqui os caminhos são criados, usados e conferidos pelo mesmo interpretador.
      - name: Assistente cria .config e .list e roda os relatórios
        shell: python
        run: |
          import os, subprocess, sys, tempfile

          pasta = tempfile.mkdtemp(prefix='sl-ci-')
          respostas = os.path.join(pasta, 'respostas.txt')
          with open(respostas, 'w', encoding='utf-8') as arquivo:
              arquivo.write(
                  'Grupo CI\n'
                  '1111111111111111 , Ana Beatriz Ferreira Lima\n'
                  '2222222222222222 , Carlos Eduardo Mendes Rocha\n'
                  '\n'
                  '2000\n'
                  'hoje\n'
                  f'{pasta}/relatorios\n'
                  f'{os.getcwd()}/exemplo/demo-lattes/cache\n'
                  '\n'
                  's\n')

          with open(respostas, encoding='utf-8') as entrada:
              resultado = subprocess.run(
                  [sys.executable, '-m', 'scriptLattes.assistente', '--pasta', pasta, '--rodar'],
                  stdin=entrada)
          assert resultado.returncode == 0, f'o assistente terminou com código {resultado.returncode}'

          for nome in ('grupo-ci.config', 'grupo-ci.list',
                       os.path.join('relatorios', 'index.html')):
              caminho = os.path.join(pasta, nome)
              assert os.path.isfile(caminho), f'não foi criado: {caminho}'
          print('assistente ok:', pasta)

      # O lançador é o caminho que um usuário sem experiência percorre: ele precisa
      # funcionar nos dois sistemas, criando o ambiente virtual e instalando tudo.
      - name: Lançador (Linux/macOS)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: ./executar.sh --diagnostico

      - name: Lançador (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: cmd
        run: executar.bat --diagnostico

      - name: Diagnóstico direto pelo Python
        continue-on-error: true
        run: python scriptLattes.py --diagnostico

      # O exemplo do projeto usa currículos sintéticos que ficam versionados no
      # repositório: precisa rodar de ponta a ponta sem internet e sem navegador.
      - name: Demonstração offline (currículos sintéticos)
        run: |
          python scriptLattes.py exemplo/demo.config
          python -c "import os,sys; sys.exit(0 if os.path.isfile('exemplo/demo-lattes/saida/index.html') else 1)"
          python -c "import glob,sys; sys.exit(0 if len(glob.glob('exemplo/demo-lattes/saida/json/*.json')) == 3 else 1)"

      - name: Importar currículos salvos pelo navegador (--adicionar-cv)
        shell: bash
        run: |
          pasta="$(mktemp -d)"
          python scriptLattes.py --adicionar-cv exemplo/demo-lattes/cache --cache "$pasta/cache"
          python -c "import glob,os,sys; sys.exit(0 if len(os.listdir('$pasta/cache')) == 3 else 1)"

      # Sem currículos em cache/ (a pasta é ignorada pelo git), o programa precisa
      # explicar o problema em português, sem traceback e sem travar. O .list aponta
      # para um arquivo inexistente de propósito: assim o teste não depende de haver
      # ou não Chrome/ChromeDriver/rede no runner (o download automático do driver
      # tornava este passo instável).
      - name: Falha previsível deve ser explicada, não quebrada
        shell: bash
        run: |
          pasta="$(mktemp -d)"
          {
            echo "global-arquivo_de_entrada = $pasta/nao-existe.list"
            echo "global-diretorio_de_saida = $pasta/saida"
            echo "global-diretorio_de_armazenamento_de_cvs = $pasta/cache"
          } > "$pasta/ci.config"
          set +e
          python scriptLattes.py "$pasta/ci.config" > "$pasta/saida.txt" 2> "$pasta/erro.txt"
          codigo=$?
          set -e
          echo "código de saída: $codigo"
          cat "$pasta/saida.txt"
          test "$codigo" -eq 2
          grep -q '\[ERRO\]' "$pasta/saida.txt"
          grep -q 'O que fazer:' "$pasta/saida.txt"
          test ! -s "$pasta/erro.txt"
